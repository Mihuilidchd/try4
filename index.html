<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>✦</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #07070d;
      overflow: hidden;
      font-family: 'Georgia', serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ══════════════════════════════
       HERO
    ══════════════════════════════ */
    #hero {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: #07070d;
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    #hero.hidden {
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
    }
    #hero::before {
      content: '';
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(130,90,255,0.08) 0%, transparent 70%);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1);   opacity: 0.5; }
      50%       { transform: scale(1.45); opacity: 1; }
    }

    #startBtn {
      position: relative; z-index: 1;
      width: 78px; height: 78px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.3s, box-shadow 0.3s;
      animation: btnGlow 3.5s ease-in-out infinite;
      -webkit-appearance: none;
    }
    #startBtn::after {
      content: '';
      position: absolute; inset: 11px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
    }
    #startBtn span {
      font-size: 1.4rem;
      color: rgba(255,255,255,0.28);
      user-select: none;
      line-height: 1;
    }
    #startBtn:hover  { transform: scale(1.1); }
    #startBtn:active { transform: scale(0.95); }
    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 0 16px rgba(140,100,255,0.1); }
      50%       { box-shadow: 0 0 36px rgba(140,100,255,0.28), 0 0 70px rgba(140,100,255,0.08); }
    }

    /* ══════════════════════════════
       PHOTOS — absolute, irregular
    ══════════════════════════════ */
    .photo {
      position: fixed;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(0,0,0,0.85);
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      z-index: 10;
    }
    .photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.75) saturate(0.75);
    }

    /* — Photo 1: top-left, organic blob, tilted left — */
    #p1 {
      left: 3vw; top: 8vh;
      width: clamp(110px, 18vw, 210px);
      height: clamp(160px, 38vh, 320px);
      border-radius: 55% 45% 60% 40% / 50% 60% 40% 50%;
      transform: translateX(-130%) rotate(-7deg);
      border: 1px solid rgba(160,100,255,0.15);
    }
    #p1.in { transform: translateX(0) rotate(-7deg); }

    /* — Photo 2: bottom-left, pill-ish, slight tilt — */
    #p2 {
      left: 6vw; bottom: 8vh;
      width: clamp(100px, 16vw, 190px);
      height: clamp(140px, 32vh, 280px);
      border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%;
      transform: translateX(-130%) rotate(5deg);
      transition-delay: 0.1s;
      border: 1px solid rgba(100,160,255,0.12);
    }
    #p2.in { transform: translateX(0) rotate(5deg); }

    /* — Photo 3: top-right, asymmetric, tilted right — */
    #p3 {
      right: 3vw; top: 10vh;
      width: clamp(115px, 19vw, 215px);
      height: clamp(165px, 40vh, 330px);
      border-radius: 45% 55% 35% 65% / 55% 45% 55% 45%;
      transform: translateX(130%) rotate(6deg);
      transition-delay: 0.05s;
      border: 1px solid rgba(80,200,160,0.13);
    }
    #p3.in { transform: translateX(0) rotate(6deg); }

    /* — Photo 4: bottom-right, rounded diamond-ish — */
    #p4 {
      right: 5vw; bottom: 9vh;
      width: clamp(100px, 17vw, 195px);
      height: clamp(145px, 34vh, 290px);
      border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
      transform: translateX(130%) rotate(-5deg);
      transition-delay: 0.15s;
      border: 1px solid rgba(255,140,100,0.12);
    }
    #p4.in { transform: translateX(0) rotate(-5deg); }

    /* — Photo 5: center-top, wide, slides from top — */
    #p5 {
      top: 2vh; left: 50%;
      width: clamp(90px, 14vw, 160px);
      height: clamp(100px, 22vh, 200px);
      border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;
      transform: translate(-50%, -130%) rotate(2deg);
      transition-delay: 0.2s;
      border: 1px solid rgba(200,160,255,0.12);
    }
    #p5.in { transform: translate(-50%, 0) rotate(2deg); }

    /* ══════════════════════════════
       CENTER TEXT
    ══════════════════════════════ */
    #centerText {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -40%);
      z-index: 15;
      text-align: center;
      width: clamp(160px, 28vw, 280px);
      opacity: 0;
      transition: opacity 0.7s ease 0.5s, transform 0.7s cubic-bezier(0.22,1,0.36,1) 0.5s;
      pointer-events: none;
    }
    #centerText.in {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .ct-label {
      font-size: clamp(0.52rem, 1.2vw, 0.62rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #2a2a42;
      margin-bottom: 10px;
      font-family: 'Segoe UI', sans-serif;
    }
    .ct-title {
      font-size: clamp(1.05rem, 3vw, 1.55rem);
      font-weight: 400;
      font-style: italic;
      color: #c8c4e4;
      letter-spacing: 0.03em;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .ct-rule {
      width: 24px; height: 1px;
      background: linear-gradient(90deg, transparent, #2a2450, transparent);
      margin: 0 auto 12px;
    }
    .ct-body {
      font-size: clamp(0.62rem, 1.4vw, 0.76rem);
      line-height: 1.8;
      color: #7878a0;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ── back button ── */
    #resetBtn {
      position: fixed; top: 18px; right: 18px; z-index: 30;
      background: transparent;
      border: 1px solid #141424;
      color: #282848;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 8px 15px;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease 0.9s, color 0.25s, border-color 0.25s;
      -webkit-appearance: none;
    }
    #resetBtn.visible { opacity: 1; pointer-events: all; }
    #resetBtn:hover   { color: #8080b0; border-color: #2a2a60; }

    /* ══════════════════════════════
       MOBILE ≤ 500px
    ══════════════════════════════ */
    @media (max-width: 500px) {
      #p1 { left: 1vw; top: 14vh;  width: 26vw; height: 32vh; }
      #p2 { left: 2vw; bottom: 8vh; width: 24vw; height: 28vh; }
      #p3 { right: 1vw; top: 14vh; width: 26vw; height: 32vh; }
      #p4 { right: 2vw; bottom: 8vh; width: 24vw; height: 28vh; }
      #p5 {
        top: 1vh; left: 50%;
        width: 22vw;
        height: 12vh;
      }

      #centerText { width: 36vw; }
      .ct-title { font-size: 0.9rem; }
      .ct-label { letter-spacing: 0.18em; }
      .ct-body { font-size: 0.68rem; line-height: 1.7; color: #7878a0; }
    }

    @media (max-width: 360px) {
      #p1, #p3 { width: 28vw; height: 30vh; }
      #p2, #p4 { width: 26vw; height: 26vh; }
      #p5 { width: 24vw; height: 11vh; }
      #centerText { width: 30vw; }
    }

    /* landscape phones */
    @media (max-height: 480px) {
      #p5 { display: none; }
      #p1, #p3 { top: 5vh; height: 80vh; }
      #p2, #p4 { display: none; }
      .ct-body { font-size: 0.6rem; line-height: 1.6; }
    }
  </style>
</head>
<body>

  <!-- ── HERO ── -->
  <div id="hero">
    <button id="startBtn" onclick="startGallery()" aria-label="Open">
      <span>✦</span>
    </button>
  </div>

  <!-- ── PHOTOS ── -->
  <div class="photo" id="p1">
    <img src="1.jpg" alt="" loading="eager" />
  </div>
  <div class="photo" id="p2">
    <img src="2.jpg" alt="" loading="eager" />
  </div>
  <div class="photo" id="p3">
    <img src="3.jpg" alt="" loading="eager" />
  </div>
  <div class="photo" id="p4">
    <img src="4.jpg" alt="" loading="eager" />
  </div>
  <div class="photo" id="p5">
    <img src="5.jpg" alt="" loading="eager" />
  </div>

  <!-- ── CENTER TEXT ── -->
  <div id="centerText">
    <p class="ct-label">Галлерея</p>
    <h1 class="ct-title">Ксюшеньки</h1>
    <div class="ct-rule"></div>
    <p class="ct-body">
      Делу время<br>
      Пиво щас
    </p>
  </div>

  <!-- ── BACK ── -->
  <button id="resetBtn" onclick="resetGallery()">← back</button>

  <script>
    var photos = ['p1','p2','p3','p4','p5'];

    function startGallery() {
      document.getElementById('hero').classList.add('hidden');
      setTimeout(function () {
        photos.forEach(function(id) {
          document.getElementById(id).classList.add('in');
        });
        document.getElementById('centerText').classList.add('in');
        document.getElementById('resetBtn').classList.add('visible');
      }, 340);
    }

    function resetGallery() {
      document.getElementById('resetBtn').classList.remove('visible');
      document.getElementById('centerText').classList.remove('in');
      photos.forEach(function(id) {
        document.getElementById(id).classList.remove('in');
      });
      setTimeout(function () {
        document.getElementById('hero').classList.remove('hidden');
      }, 600);
    }
  </script>
</body>
</html>
